name: 自动版本号、侧边栏与格式

on:
  push:
    branches: [main, dev]
    paths:
      - 'docs/**.md'
      - 'gen_toc_from_docs.py'
      - 'fix_toc_and_spacing.py'
      - 'bump_version.py'
      - '!docs/SUMMARY.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（完整历史，供对比变更文件）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 更新版本号（仅 main，日期-当日序号）
        run: |
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "非 main 分支，跳过版本号更新"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.event.after }}"
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "非推送事件或首次推送，跳过版本号更新"
            exit 0
          fi
          if git -c core.quotepath=false diff --name-only "$BEFORE" "$AFTER" | grep -E '^docs/.*\.md$' | grep -qv '^docs/SUMMARY.md$'; then
            python3 bump_version.py
          else
            echo "本次推送未改动 docs 正文，跳过版本号更新"
          fi

      - name: 重新生成侧边栏
        run: python3 gen_toc_from_docs.py

      - name: 自动校正格式（标题空行、图片路径、公式写法、裸链接、波浪线、锚点）
        run: python3 fix_toc_and_spacing.py --apply

      - name: 如有变化则提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ README.md
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          elif [ "${{ github.ref_name }}" = "main" ]; then
            git commit -m "自动更新版本号并同步侧边栏与格式"
            git push
          else
            git commit -m "自动同步侧边栏与格式"
            git push
          fi
