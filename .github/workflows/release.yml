name: 标记 Release 版本

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 格式与图片路径收尾
        run: python3 fix_toc_and_spacing.py --apply

      - name: 图片按位置转正命名
        run: python3 normalize_images.py --apply

      - name: 追加 -REL 后缀
        run: python3 bump_version.py --release

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md docs/
          if git diff --cached --quiet; then
            echo "无变化（可能已是 Release）"
          else
            git commit -m "整理图片命名并标记 Release 版本"
            git push
          fi
